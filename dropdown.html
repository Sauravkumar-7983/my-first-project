<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
   
  
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      background-color: #D1F8EF;
    }
    header{
      box-shadow:5px 5px 10px rgba(0,0,0,0.8);
      width: 80%;
      height: 70px;
      background-color: #0d0e0f;
      margin: 20px auto;
      position: relative;
      padding: 10px;
      border-radius:10px ;
    }
    header ul{
      
      position: absolute;
      top: 20px;
      right: 25px;
      list-style-type: none;
      font-size: 25px;
      text-transform:capitalize ;
      color: white;
      display: flex;

    }
    header ul li {
      
      margin-inline: 30px;
    }
    .dropdown{
      
      position: relative;
      
    }
 


    .dropdown-content{
      display: block;
      position: absolute;
      top: 29px;
      left: 0;
      padding: 15px 0;
      display: none;
      background-color:#578FCA ;
      min-width: 120px;
      z-index: 22;
      /* border: 1px solid red; */

    }
   
    .dropdown-content a{
      display: block;
      color: white;
      text-decoration: none;
      margin-bottom: 10px;
      cursor: pointer;
      
    }
    .dropdown:hover .dropdown-content{
      display: block;
    }
  </style> 

  <body>
    <header>
      <ul class="menu">
        <li><a href="#"></a>home</li>
        <li><a href="#"></a>about us</li>
        <li class="dropdown"><a href="#"></a>gallery
          <ul class="dropdown-content">
            <li><a href="#">home</a> </li>
            <li><a href="#">home</a></li>
            <li><a href="#">home</a></li>
          </ul>
        </li>
        <li><a href="#"></a>contact us</li>
        <li><a href="#"></a>faculty</li>
      </ul>
    </header>
  </body>
</html>
